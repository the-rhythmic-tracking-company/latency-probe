# Builds, tests and packages latency-probe on every push and pull request.
# Pushing a tag vX.Y.Z also publishes a GitHub Release with the packages and
# SHA256SUMS — the single source every package-manager channel builds from.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.format }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build, unit-test and package
        run: FORMAT=${{ matrix.format }} bash scripts/build-linux.sh ${{ matrix.arch }}

      - name: End-to-end test against jackd
        if: matrix.format == 'deb'
        run: >
          docker run --rm --shm-size=256m -v "$PWD:/src" -w /src
          latency-probe-build:${{ matrix.arch }}
          bash scripts/e2e-jack.sh build/linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.format }}-${{ matrix.arch }}
          path: |
            build/linux-${{ matrix.arch }}/*.deb
            build/rpm-${{ matrix.arch }}/*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the CMake project version
        run: |
          version=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CMakeLists.txt version ${version}" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.deb *.rpm > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/*
          --title "latency-probe ${GITHUB_REF_NAME#v}"
          --notes-file docs/release-notes.md
